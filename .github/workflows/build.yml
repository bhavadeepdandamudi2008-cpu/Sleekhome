name: Build APK
on:
  workflow_dispatch:
  push:
    paths:
      - "SleekHome.zip"
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Unzip project
        run: unzip -q SleekHome.zip
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"
      - name: Build debug APK
        run: gradle -p SleekHome assembleDebug --no-daemon
      - name: Rename APK
        run: cp SleekHome/app/build/outputs/apk/debug/app-debug.apk SleekHome.apk
      - name: Publish APK
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: SleekHome build ${{ github.run_number }}
          files: SleekHome.apk
